<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuri Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08070d;color:#fff;font-family:Arial,sans-serif}header{padding:16px 20px;border-bottom:1px solid #292230;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#09080df2;z-index:5}.logo{font-weight:900;font-size:22px}.logo b{color:#a855f7}.search{flex:1;max-width:550px;background:#15121d;border:1px solid #30283a;border-radius:10px;padding:11px;color:white}button{border:0;border-radius:10px;padding:11px 15px;background:#a855f7;color:white;font-weight:bold}main{max-width:1100px;margin:auto;padding:25px 18px 100px}.hero{padding:38px;border-radius:22px;background:radial-gradient(circle at 80% 10%,#7c3aed,#28133e 35%,#11101a 75%);border:1px solid #3a2849;margin-bottom:28px}.hero h1{font-size:44px;margin:8px 0}.muted{color:#aaa0b4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#121019;border:1px solid #27212f;border-radius:15px;padding:13px}.cover{height:155px;border-radius:11px;background:linear-gradient(135deg,#261136,#9333ea);display:grid;place-items:center;font-size:42px}.player{position:fixed;bottom:0;left:0;right:0;background:#100d16f5;border-top:1px solid #30283a;padding:10px 18px;display:flex;gap:14px;align-items:center;z-index:6}.player audio{flex:1}@media(max-width:650px){.hero h1{font-size:32px}.cover{height:125px}.player audio{max-width:210px}}
</style></head><body>
<header><div class="logo">YURI <b>MUSIC</b></div><input id="q" class="search" placeholder="Rechercher un titre, artiste..." oninput="render()"><button onclick="upload()">＋ Publier</button></header>
<main><section class="hero"><div class="muted">YURI MUSIC</div><h1>Ta musique. Ton univers.</h1><p class="muted">Découvre et présente des artistes indépendants.</p><button onclick="upload()">Publier un son 🎵</button></section><h2>🔥 Tendances</h2><div id="list" class="grid"></div></main>
<div class="player"><b id="now">Aucun titre</b><audio id="audio" controls></audio></div>
<script>
let songs=JSON.parse(localStorage.getItem("ym_songs")||"null")||[
{title:"Collimateur ❤️‍🩹",artist:"Yuri",genre:"Afro R&B",plays:1240,likes:86},
{title:"À jamais",artist:"Yuri",genre:"Afrobeat",plays:930,likes:71},
{title:"Bazar",artist:"Yuri",genre:"Afro Drill",plays:720,likes:55},
{title:"Cauchemar",artist:"Yuri",genre:"Rap",plays:610,likes:43}];
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){let q=document.getElementById("q").value.toLowerCase();let a=songs.filter(s=>(s.title+" "+s.artist+" "+s.genre).toLowerCase().includes(q));document.getElementById("list").innerHTML=a.map((s,i)=>`<div class="card"><div class="cover">${s.cover?`<img src="${s.cover}" style="width:100%;height:100%;object-fit:cover;border-radius:11px">`:"♪"}</div><h3>${esc(s.title)}</h3><div class="muted">${esc(s.artist)} · ${esc(s.genre)}</div><p class="muted">▶ ${s.plays} · ♥ ${s.likes}</p><button onclick="play(${songs.indexOf(s)})">▶ Écouter</button></div>`).join("")||"<p class='muted'>Aucun résultat.</p>"}
function play(i){let s=songs[i];if(!s.audio)return alert("Ce morceau démo n'a pas encore de fichier audio.");document.getElementById("now").textContent=s.title+" · "+s.artist;let a=document.getElementById("audio");a.src=s.audio;a.play();s.plays++;localStorage.setItem("ym_songs",JSON.stringify(songs));render()}
function upload(){let t=prompt("Titre du morceau :");if(!t)return;let ar=prompt("Nom de l'artiste :")||"Artiste Yuri";let f=document.createElement("input");f.type="file";f.accept="audio/*";f.onchange=()=>{let file=f.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{songs.unshift({title:t,artist:ar,genre:"Nouveau",plays:0,likes:0,audio:r.result});localStorage.setItem("ym_songs",JSON.stringify(songs));render();alert("Son ajouté 🔥")};r.readAsDataURL(file)};f.click()}
render();
</script></body></html>
